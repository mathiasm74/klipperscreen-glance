# glance.cfg — the Klipper-side contract for the Glance KlipperScreen UI.
#
#   [include glance.cfg]
#
# Glance's job screen drives its phases by parsing the M117 messages your
# print macros emit. This file provides the emitting macros; wire them into
# your own PRINT_START (example at the bottom). The protocol, exactly:
#
#   M117 ██░░... 23% Bed 45/110     <- emitted by _HEAT_WAIT: amber HEATING
#                                      phase with a live percent
#   M117 Leveling gantry            <- cyan LEVELING phase ("probe: at ..."
#                                      console lines drive the QGL counter)
#   M117 Scanning bed mesh          <- cyan MESHING phase
#   (M117 cleared, print moves)     <- green PRINTING phase
#
# The wording is load-bearing: change these strings and the UI loses its
# phase detection. Beyond M117, the Glance panels call these macros when
# they exist (buttons hide when they don't):
#
#   UNLOAD_FILAMENT / LOAD_FILAMENT  (Extrude screen + paused job screen)
#   G32 or QUAD_GANTRY_LEVEL         (Move screen's QGL verb)


# Replaces M190/M109 for print-start heating. Plain blocking waits hold
# Klipper's gcode queue so NOTHING can update a display mid-heat; this
# unrolls the wait into ~5° TEMPERATURE_WAIT chunks and narrates progress
# via M117 between them. Percent is measured from 25° ambient so a warm
# start shows e.g. 63->100 instead of restarting at 0.
#   _HEAT_WAIT HEATER=heater_bed TARGET=110
#   _HEAT_WAIT HEATER=extruder TARGET=150 ABOVE_OK=30
[gcode_macro _HEAT_WAIT]
gcode:
   {% set heater = params.HEATER|default("heater_bed") %}
   {% set target = params.TARGET|float %}
   {% set above_ok = params.ABOVE_OK|default(0)|float %}
   {% set label = "Bed" if heater == "heater_bed" else "Nozzle" %}
   {% set cur = printer[heater].temperature %}
   {% set diff = target - cur %}
   {% if heater == "heater_bed" %}
     M140 S{target}
   {% else %}
     M104 S{target}
   {% endif %}
   {% if diff < 0 and diff|abs <= above_ok %}
     ; already within the acceptable overshoot window - no cooldown wait
   {% elif diff|abs >= 2 %}
     {% set steps = [[(diff|abs / 5)|round(0, 'ceil')|int, 20]|min, 1]|max %}
     {% for i in range(1, steps + 1) %}
       {% set from_t = cur + diff * (i - 1) / steps %}
       {% if diff > 0 and target > 26 %}
         {% set pct = (100 * (from_t - 25) / (target - 25))|int %}
       {% else %}
         {% set pct = (100 * (i - 1) / steps)|int %}
       {% endif %}
       {% set pct = [[pct, 0]|max, 99]|min %}
       {% set filled = pct // 10 %}
       M117 {"█" * filled}{"░" * (10 - filled)} {pct}% {label} {from_t|int}/{target|int}
       {% if i < steps %}
         TEMPERATURE_WAIT SENSOR={heater} {"MINIMUM" if diff > 0 else "MAXIMUM"}={cur + diff * i / steps}
       {% else %}
         ; final chunk uses the same +-1 settle window as M190/M109, so PID
         ; hovering just shy of the target can't stall the last step
         TEMPERATURE_WAIT SENSOR={heater} {"MINIMUM" if diff > 0 else "MAXIMUM"}={target - 1 if diff > 0 else target + 1}
       {% endif %}
     {% endfor %}
   {% endif %}
   M117 ██████████ 100% {label} {target|int}


# Filament change helpers for the Extrude and paused screens. Tune the
# distances to your extruder's filament path (defaults suit a Voron
# Clockwork2/Stealthburner). Both refuse politely below min_extrude_temp.
[gcode_macro UNLOAD_FILAMENT]
gcode:
   {% if printer.extruder.can_extrude %}
     M83 ; relative extruder
     G1 E5 F300 ; soften the tip so it pulls a clean point
     G1 E-80 F1800 ; pull clear of the extruder
     G92 E0
   {% else %}
     {action_respond_info("Nozzle too cold to unload - heat it first")}
   {% endif %}

[gcode_macro LOAD_FILAMENT]
gcode:
   {% if printer.extruder.can_extrude %}
     M83 ; relative extruder
     G1 E50 F300 ; feed down to the meltzone
     G1 E25 F150 ; slow purge to prime
     G92 E0
   {% else %}
     {action_respond_info("Nozzle too cold to load - heat it first")}
   {% endif %}


# Optional heat-soak bookkeeping: counts minutes the bed has held a printing
# temperature. PRINT_START can use it to skip QGL + mesh on a soaked machine
# (see the example below). Bed off, or a Klipper restart, resets the count -
# both err on the safe side.
[gcode_macro _SOAK_STATE]
variable_minutes: 0
gcode:
   RESPOND MSG="Heat soak: {printer['gcode_macro _SOAK_STATE'].minutes} min"

[delayed_gcode SOAK_TICK]
initial_duration: 60
gcode:
   {% set st = printer["gcode_macro _SOAK_STATE"] %}
   {% set bed = printer.heater_bed %}
   {% if bed.target >= 60 and bed.temperature > bed.target - 5 %}
     SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=minutes VALUE={st.minutes + 1}
   {% elif bed.target < 60 %}
     SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=minutes VALUE=0
   {% endif %}
   UPDATE_DELAYED_GCODE ID=SOAK_TICK DURATION=60


# ---------------------------------------------------------------------------
# PRINT_START integration example (adapt into your own macro - do NOT
# uncomment as-is). The M117 phase labels are the part Glance depends on.
#
# [gcode_macro PRINT_START]
# gcode:
#    {% set BED_TEMP = params.BED|default(100)|float %}
#    {% set EXTRUDER_TEMP = params.EXTRUDER|default(220)|float %}
#    _HEAT_WAIT HEATER=heater_bed TARGET={BED_TEMP}
#    _HEAT_WAIT HEATER=extruder TARGET=150 ABOVE_OK=30   ; probe-safe temp
#    {% set soaked = printer["gcode_macro _SOAK_STATE"].minutes >= 45 %}
#    {% if not ('xyz' in printer.toolhead.homed_axes
#               and printer.quad_gantry_level.applied and soaked) %}
#      M117 Leveling gantry
#      G32                                ; home + QGL + park
#      M117 Scanning bed mesh
#      BED_MESH_CALIBRATE
#    {% endif %}
#    _HEAT_WAIT HEATER=extruder TARGET={EXTRUDER_TEMP}
#    M117                                 ; clear -> PRINTING phase
#    ...purge line etc...
