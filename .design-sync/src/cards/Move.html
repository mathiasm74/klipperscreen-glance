<!-- @dsCard group="Screens" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glance — Move</title>
<style>
{{FONTS}}
{{TOKENS}}
{{SHARED}}
/* move-specific */
.move-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px 10px 4px 10px;
    min-width: 0;
    gap: 8px;
}
.move-cols { flex: 1; display: flex; gap: 14px; min-height: 0; }
.map-col { display: flex; flex-direction: column; gap: 6px; flex: none; }
.readouts { display: flex; gap: 8px; }
.readouts .cell {
    flex: 1;
    height: 46px;
    background: var(--surface);
    border-radius: 10px;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    padding-top: 6px;
}
.readouts .k { font-size: 22px; color: var(--dim); }
.readouts .v { font-size: 28px; color: var(--text); }
.z-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.z-val { font-family: var(--font-display); font-size: 58px; color: var(--text); line-height: 1; }
.verbs { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.verb {
    height: 52px;
    background: var(--surface);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--text);
    flex: none;
}
.verb.dim { color: #5a5d66; }
.precise {
    height: 46px;
    flex: none;
    background: var(--surface);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--text);
}
</style>
</head>
<body>

<div class="variant">
  <div class="caption">Move — tap-to-go bed map, Z height map, one-tap verbs</div>
  <div class="stage">
    <div class="titlebar"><span>Voron Move</span><span>24° &nbsp;·&nbsp; 23° &nbsp;&nbsp; 09:15</span></div>
    <div class="trow">
      <div class="action-bar">
        <div class="ab-btn">‹</div>
        <div class="ab-btn">⌂</div>
        <div class="ab-spacer"></div>
        <div class="ab-estop">STOP</div>
      </div>
      <div class="panel">
        <div class="frame">
          <div class="move-main">
            <div class="move-cols">

              <div class="map-col">
                <!-- bed map: 6x6 grid, snap dots, live head dot, cyan drag target -->
                <svg width="384" height="384" viewBox="0 0 384 384">
                  <rect x="1" y="1" width="382" height="382" rx="10" fill="#111318" stroke="#262c36" stroke-width="2"/>
                  <g stroke="#1e232c" stroke-width="1">
                    <line x1="65" y1="8" x2="65" y2="376"/><line x1="129" y1="8" x2="129" y2="376"/><line x1="192" y1="8" x2="192" y2="376"/><line x1="256" y1="8" x2="256" y2="376"/><line x1="320" y1="8" x2="320" y2="376"/>
                    <line x1="8" y1="65" x2="376" y2="65"/><line x1="8" y1="129" x2="376" y2="129"/><line x1="8" y1="192" x2="376" y2="192"/><line x1="8" y1="256" x2="376" y2="256"/><line x1="8" y1="320" x2="376" y2="320"/>
                  </g>
                  <g fill="#2c333f">
                    <circle cx="65" cy="65" r="3"/><circle cx="192" cy="65" r="3"/><circle cx="320" cy="65" r="3"/>
                    <circle cx="65" cy="192" r="3"/><circle cx="192" cy="192" r="3"/><circle cx="320" cy="192" r="3"/>
                    <circle cx="65" cy="320" r="3"/><circle cx="192" cy="320" r="3"/><circle cx="320" cy="320" r="3"/>
                  </g>
                  <!-- live head position -->
                  <circle cx="192" cy="192" r="7" fill="#e8eaed"/>
                  <!-- drag target: ring + delayed coordinate label, offset from the finger -->
                  <circle cx="295" cy="110" r="12" fill="none" stroke="#33c5e8" stroke-width="3"/>
                  <text x="248" y="76" font-family="Space Grotesk" font-size="21" fill="#33c5e8">X 243 · Y 229</text>
                </svg>
                <div class="readouts">
                  <div class="cell"><span class="k">X</span><span class="v">150.0</span></div>
                  <div class="cell"><span class="k">Y</span><span class="v">150.0</span></div>
                  <div class="cell"><span class="v">150</span><span class="k">mm/s</span></div>
                </div>
              </div>

              <div class="z-col">
                <div class="z-val">42.00</div>
                <!-- z height map: snap lines at 0/10/50/75/100, drag for exact -->
                <svg width="128" height="392" viewBox="0 0 128 392">
                  <rect x="1" y="1" width="126" height="390" rx="10" fill="#111318" stroke="#262c36" stroke-width="2"/>
                  <!-- snap lines (z 0..110 mapped bottom to top, 14px pad) -->
                  <g stroke="#3a414d" stroke-width="2" stroke-dasharray="7 6">
                    <line x1="14" y1="47" x2="114" y2="47"/>
                    <line x1="14" y1="129" x2="114" y2="129"/>
                    <line x1="14" y1="212" x2="114" y2="212"/>
                    <line x1="14" y1="345" x2="114" y2="345"/>
                    <line x1="14" y1="378" x2="114" y2="378"/>
                  </g>
                  <g font-family="Space Grotesk" font-size="18" fill="#7b7d86">
                    <text x="20" y="41">100</text>
                    <text x="20" y="123">75</text>
                    <text x="20" y="206">50</text>
                    <text x="20" y="339">10</text>
                    <text x="20" y="374">0</text>
                  </g>
                  <!-- live height -->
                  <line x1="8" y1="252" x2="120" y2="252" stroke="#e8eaed" stroke-width="3"/>
                  <!-- drag target -->
                  <line x1="8" y1="212" x2="120" y2="212" stroke="#33c5e8" stroke-width="3"/>
                </svg>
              </div>

              <div class="verbs">
                <div class="verb">Home XYZ</div>
                <div class="verb">QGL</div>
                <div class="verb">Bed mesh</div>
                <div class="verb">Z-offset</div>
                <div class="verb">Motors off</div>
              </div>

            </div>
            <div class="precise">Precise moves</div>
          </div>
        </div>
        <div class="rail"><div class="fill" style="width:0%"></div></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
